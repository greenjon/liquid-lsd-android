name: Release

# A v* tag builds the release APK. It is published from here only when signing secrets are configured
# (RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD). Without them
# releases are made locally with scripts/release.sh, which signs with the local key and publishes the APK,
# and this job only checks that the tagged code builds and passes its tests.
on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets: building and testing only; the release is published by scripts/release.sh." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Test and build
        env:
          KEYSTORE_PATH: ${{ steps.key.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Publish
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "liquid-lsd-${GITHUB_REF_NAME}.apk"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" "liquid-lsd-${GITHUB_REF_NAME}.apk" --clobber \
            || gh release create "$GITHUB_REF_NAME" "liquid-lsd-${GITHUB_REF_NAME}.apk" --title "Liquid LSD $GITHUB_REF_NAME" --generate-notes --prerelease
