name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Unit tests, lint, debug build
        run: ./gradlew --no-daemon testDebugUnitTest :app:lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: liquid-lsd-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
